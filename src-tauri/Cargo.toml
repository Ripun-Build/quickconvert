[package]
name = "quickconvert"
version = "0.1.0"
description = "Convert, compress and crop files from a popup at your cursor"
authors = ["Ripunjoy Brahma"]
edition = "2021"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "quickconvert_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
tauri-plugin-global-shortcut = "2"
window-vibrancy = "0.8.1"
tauri-plugin-dialog = "2"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "bmp", "gif", "tiff"] }
lopdf = "0.45.0"
webp = "0.3.1"
pdfium-render = "0.9.4"
tauri-plugin-autostart = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Optimise dependencies in dev builds so image decoding (thumbnails) stays fast.
[profile.dev.package."*"]
opt-level = 2
