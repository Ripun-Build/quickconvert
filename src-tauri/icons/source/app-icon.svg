<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- QuickConvert app icon: a document turning into a photo. macOS icon grid: 824 px tile at 100 px inset.
       Shadows are drawn as shapes (no SVG filters) so every renderer shows them. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4BA0FF"/>
      <stop offset="1" stop-color="#0A5BE0"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FD3FF"/>
      <stop offset="1" stop-color="#D9F1FF"/>
    </linearGradient>
    <clipPath id="photoClip">
      <rect x="452" y="388" width="332" height="250" rx="22"/>
    </clipPath>
  </defs>

  <!-- Tile -->
  <rect x="100" y="112" width="824" height="824" rx="185" fill="#000" fill-opacity="0.18"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
  <rect x="102" y="102" width="820" height="820" rx="183" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="4"/>

  <!-- Document (back) -->
  <path d="M262 252 h236 l92 92 v356 a28 28 0 0 1 -28 28 h-300 a28 28 0 0 1 -28 -28 v-420 a28 28 0 0 1 28 -28 z" fill="#002a6b" fill-opacity="0.22"/>
  <path d="M262 236 h236 l92 92 v356 a28 28 0 0 1 -28 28 h-300 a28 28 0 0 1 -28 -28 v-420 a28 28 0 0 1 28 -28 z" fill="#ffffff"/>
  <path d="M498 236 v64 a28 28 0 0 0 28 28 h64 z" fill="#D6E6FF"/>
  <rect x="290" y="372" width="140" height="22" rx="11" fill="#B9D2FA"/>
  <rect x="290" y="420" width="124" height="22" rx="11" fill="#B9D2FA"/>
  <rect x="290" y="468" width="110" height="22" rx="11" fill="#B9D2FA"/>

  <!-- Photo (front) -->
  <rect x="432" y="384" width="372" height="290" rx="34" fill="#002a6b" fill-opacity="0.25"/>
  <rect x="432" y="368" width="372" height="290" rx="34" fill="#ffffff" stroke="#C9DCFA" stroke-width="4"/>
  <g clip-path="url(#photoClip)">
    <rect x="452" y="388" width="332" height="250" fill="url(#sky)"/>
    <circle cx="712" cy="452" r="30" fill="#FFC93D"/>
    <path d="M452 638 L560 500 L640 590 L690 540 L784 638 Z" fill="#2FBF71"/>
    <path d="M452 638 L560 500 L604 556 L540 638 Z" fill="#1FA45E"/>
  </g>

  <!-- Convert badge -->
  <circle cx="340" cy="742" r="96" fill="#002a6b" fill-opacity="0.25"/>
  <circle cx="340" cy="728" r="96" fill="#ffffff"/>
  <circle cx="340" cy="728" r="80" fill="#0A5BE0"/>
  <path d="M292 710 h84 l-28 -28 M388 746 h-84 l28 28" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
