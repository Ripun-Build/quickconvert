# Windows build: runs every check and makes the installer, so the Windows version can be built and
# tested from a Mac. Download the installer from the run's "Artifacts".
name: Windows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install packages
        run: npm ci

      - name: Fetch the PDF engine
        shell: bash
        run: sh scripts/fetch-pdfium.sh

      - name: Frontend checks
        run: |
          npx tsc --noEmit
          npm test

      - name: Rust lint
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Build the installer
        run: npx tauri build --bundles nsis

      - uses: actions/upload-artifact@v7
        with:
          name: QuickConvert-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 14
